<svg xmlns="http://w3.org" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <radialGradient id="damaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#fde047" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mtnLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="mtnDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Fons arrodonit principal -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#sky)"/>

  <!-- Estels -->
  <circle cx="48" cy="52" r="2.2" fill="#f8fafc" opacity="0.6"/>
  <circle cx="204" cy="44" r="2.8" fill="#f8fafc" opacity="0.7"/>
  <circle cx="182" cy="76" r="1.8" fill="#f8fafc" opacity="0.4"/>
  <circle cx="72" cy="84" r="1.8" fill="#f8fafc" opacity="0.5"/>

  <!-- Aura i estel de la Dama -->
  <circle cx="128" cy="52" r="46" fill="url(#damaAura)"/>
  <path d="M128 36 L131 49 L144 52 L131 55 L128 68 L125 55 L112 52 L125 49 Z" fill="#fef9c3"/>

  <!-- Muntanya (2 cares) -->
  <polygon points="128,62 232,208 128,208" fill="url(#mtnDark)"/>
  <polygon points="128,62 24,208 128,208" fill="url(#mtnLight)"/>

  <!-- Neu al cim -->
  <polygon points="128,62 96,107 110,101 121,112 128,104" fill="#f8fafc"/>
  <polygon points="128,62 160,107 146,101 135,112 128,104" fill="#94a3b8"/>

  <!-- Turó fons (bosc) adaptat al marc -->
  <path d="M 0 202 Q 75 155 168 198 L 168 256 L 56 256 A 56 56 0 0 1 0 200 Z" fill="url(#hillBack)"/>

  <!-- Pins -->
  <polygon points="48,158 36,184 60,184" fill="#064e3b"/>
  <polygon points="48,146 39,168 57,168" fill="#065f46"/>
  <polygon points="72,166 62,188 82,188" fill="#064e3b"/>

  <!-- Cabana amb foc -->
  <g transform="translate(86, 158)">
    <circle cx="24" cy="-10" r="3" fill="#cbd5e1" opacity="0.5"/>
    <circle cx="28" cy="-18" r="4.5" fill="#cbd5e1" opacity="0.3"/>
    <rect x="4" y="10" width="26" height="18" rx="2" fill="#78350f"/>
    <polygon points="0,12 17,-2 34,12" fill="#451a03"/>
    <rect x="13" y="15" width="8" height="8" rx="1.5" fill="#fde047"/>
  </g>

  <!-- Turó primer pla (hort) adaptat al marc -->
  <path d="M 56 256 Q 110 185 256 205 L 256 200 A 56 56 0 0 1 200 256 Z" fill="url(#hillFront)"/>

  <!-- Solcs de l'hort -->
  <path d="M 145 216 Q 190 202 235 216" stroke="#14532d" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 135 232 Q 190 216 245 232" stroke="#14532d" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Brot -->
  <g transform="translate(188, 198)">
    <path d="M 0 16 Q -2 4 0 -8" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 0 2 Q -18 0 -18 -14 Q -4 -14 0 2 Z" fill="#86efac"/>
    <path d="M 0 -4 Q 18 -6 18 -20 Q 4 -20 0 -4 Z" fill="#4ade80"/>
  </g>

  <!-- Vora interior subtil -->
  <rect x="2" y="2" width="252" height="252" rx="54" ry="54" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>
</svg>
